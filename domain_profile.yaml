# Domain profile for the_world_is_not_enough (ELEKTRA)
# Advisory, declarative controls for the mission package. Validation inputs only.

mission:
  film: "The World Is Not Enough (1999)"
  codename: "ELEKTRA"
  package: "the_world_is_not_enough"
  protocol: "bond_api.MissionProvider (frozen)"

review_gates:
  - "pytest tests/ --cov=src --cov-fail-under=90"
  - "ruff check src/ scripts/ tests/"
  - "ruff format --check src/ scripts/ tests/"
  - "mypy src/ scripts/"

source_policy:
  - "pure domain core importable without bond_api"
  - "no external network calls in domain core"
  - "deterministic: fixed seed, no untracked RNG, wall_time_s = 0.0"

artifact_expectations:
  output_figures:
    - "output/figures/pipeline_network.png"
    - "output/figures/submarine_detection.png"
    - "output/figures/hostage_dynamics.png"
  output_data:
    - "output/data/manuscript_variables.json"
    - "output/data/elektra_mission.json"

benchmark_rubric:
  coverage_fail_under: 90
  mock_policy: "zero mocks"
  determinism: "obligatory"
