# Claim ledger for the_world_is_not_enough (ELEKTRA)
# Registers sourced/computed numeric claims for evidence validation.
# All RESULT_* claims are computed by the domain models deterministically
# (seed 1999); provenance is auditable via output/data/elektra_mission.json.

claims:
  - id: "elektra.max_flow"
    claim: "maximum deliverable pipeline flow"
    value: "420"
    unit: "kbbl/day"
    source: "src/the_world_is_not_enough/pipeline_security.py::edmonds_karp(default_pipeline())"
    evidence: "RESULT_MAX_FLOW"
  - id: "elektra.min_cut_capacity"
    claim: "minimum s-t cut capacity (== max flow)"
    value: "420"
    unit: "kbbl/day"
    source: "src/the_world_is_not_enough/pipeline_security.py::min_cut_edges"
    evidence: "RESULT_MIN_CUT_CAPACITY"
  - id: "elektra.choke_point_count"
    claim: "load-bearing segments running at >=90% capacity"
    value: "1"
    unit: "segments"
    source: "src/the_world_is_not_enough/pipeline_security.py::analyze_choke_points"
    evidence: "RESULT_CHOKE_POINT_COUNT"
  - id: "elektra.exposure_reduction"
    claim: "relative reduction in cumulative detection exposure from least-risk routing"
    value: "0.249"
    unit: "fraction"
    source: "src/the_world_is_not_enough/sub_defense.py::evasion_analysis"
    evidence: "RESULT_EXPOSURE_REDUCTION"
  - id: "elektra.syndrome_onset_day"
    claim: "day the syndrome index first crosses the onset threshold"
    value: "11.25"
    unit: "days"
    source: "src/the_world_is_not_enough/hostage_psychology.py::integrate_dynamics"
    evidence: "RESULT_SYNDROME_ONSET_DAY"
