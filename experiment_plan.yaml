# Experiment plan for the_world_is_not_enough (ELEKTRA)
# Prespecified conditions, metrics, and expected artifacts.

experiment:
  seed: 1999
  primary_metric: "choke_point_count + exposure_reduction + syndrome_onset_day"
  baseline: "naive 4-connected line-of-sight exposure (submarine pillar)"
  ablation:
    - "no-kindness regime: syndrome stays below onset threshold"
    - "sensor coverage absent: tamper detection rate drops to 0"

pillars:
  pipeline:
    model: "capacitated flow network (Edmonds-Karp max-flow/min-cut, betweenness, utilization)"
    dataset: "fixed 17-node / 16-edge Caspian trunk"
    expected_figures: ["pipeline_network.png"]
  submarine:
    model: "passive sonar equation + normal-CDF detection + Dijkstra evasion"
    scenario: "16x16 grid, 3 sensors, 3 km cells"
    expected_figures: ["submarine_detection.png"]
  hostage:
    model: "4-state Stockholm-syndrome ODE, RK4 integration"
    scenario: "30 days, dt=0.25, onset threshold 0.5"
    expected_figures: ["hostage_dynamics.png"]
  power:
    model: "DC power flow + sequential cascading-failure blackout"
    scenario: "8-bus, 10-line two-area corridor; strong-tie initial outage"
    expected_figures: []
  negotiation:
    model: "Rubinstein alternating-offer equilibrium + concession settlement"
    scenario: "10-day deadline, negotiator discount 0.9, syndrome-driven patience"
    expected_figures: []
  fusion:
    model: "constant-velocity linear Kalman filter"
    scenario: "20 noisy position fixes, measurement std 2.0, seed 1999"
    expected_figures: ["sensor_fusion_track.png"]

expected_tables:
  - "config token table (manuscript/05_experimental_setup.md)"
  - "artifact inventory (manuscript/06_reproducibility.md)"
