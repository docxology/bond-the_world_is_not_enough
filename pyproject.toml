# ELEKTRA Configuration — The World Is Not Enough (1999), BOND suite film package
# Package-local configuration: nothing is inherited. The only other pyproject.toml
# above this one (the vault manager's) declares no [tool.ruff]/[tool.mypy] settings
# and is not a uv workspace root.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the_world_is_not_enough"
version = "0.1.0"
license = {text = "MIT"}
description = "ELEKTRA — Special-Agent Mission Software: oil-pipeline choke-point security, submarine evasion/detection, and hostage-psychology influence modeling"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "bond-api>=0.1.0",
    "bond-utilities>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]

# Local path dependencies on the recorded copies of the FROZEN BOND-API protocol
# package (Layer 1) and the Layer 0 foundation. Both ship inside this repository
# under vendor/ and have no remote of their own.
[tool.uv.sources]
bond-api = { path = "vendor/bond-api" }
bond-utilities = { path = "vendor/bond-utilities" }

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
# Core Template Rule: We only calculate coverage for primary source code (`src/`),
# ensuring test code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# >=90% on src/ is the enforced gate; live coverage % is tracked in
# docs/_generated/COUNTS.md (do not hardcode it here — it drifts).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
# line-length 88 is the width this tree is written to (measured 2026-11-04: the
# documented format gate is clean at 88, and 25 files would be reformatted at
# 120) and ruff's own default; no ancestor pyproject.toml declares a width, so
# this file carries it.
# The vendored copies are byte-identical to upstream and must stay that way.
extend-exclude = ["vendor"]
line-length = 88
target-version = "py310"

[tool.mypy]
# Project-local mypy settings: no ancestor pyproject.toml declares any mypy
# settings, so this package's src/ layout needs its own mypy_path. Mirrors the
# root gates: strict-ish typing, explicit package bases, ignore missing stubs.
# Vendored copies are a dependency; their bytes are bound by scripts/vendor.py.
exclude = ["(^|/)vendor/"]
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.uv]
# No ancestor [tool.uv] applies: uv merges no parent settings outside a workspace,
# and the only other pyproject.toml above this one is not a workspace root
# (measured: it declares `package = false` and no [tool.uv.workspace]).
